<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf_token() }}">
  <title>{% block title %}{% endblock %} · {{ app_name }}</title>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><span class="mark">{{ app_name[:1] }}</span>{{ app_name }}</div>
      <div class="nav-links">{% include '_nav.html' %}</div>
      <div class="sidebar-foot">
        <p class="who">{{ session.name }}<br><span>{{ role_labels[session.role] }}</span></p>
        <a class="btn btn-ghost" href="{{ url_for('change_password') }}">Change password</a>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-ghost" type="submit">Log out</button>
        </form>
      </div>
    </nav>
    <main class="content" id="main">
      <div class="topbar">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch between light and dark theme" title="Light / dark theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="bell-wrap">
          <button type="button" class="icon-btn" id="bell" aria-haspopup="true" aria-expanded="false" aria-label="Notifications" title="Notifications">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            <span class="bell-count" id="bell-count" {{ 'hidden' if not notif_count }}>{{ notif_count if notif_count < 100 else '99+' }}</span>
          </button>
          <div class="bell-panel" id="bell-panel" hidden>
            <div class="bell-head"><b>Notifications</b><button type="button" class="btn btn-small btn-ghost" id="bell-readall">Mark all read</button></div>
            <ul id="bell-list"></ul>
            <a class="bell-foot" href="{{ url_for('notifications_page') }}">See all notifications</a>
          </div>
        </div>
      </div>
      {% include '_flash.html' %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
