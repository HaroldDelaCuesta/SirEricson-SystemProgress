<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ app_name }}</title>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <button type="button" class="icon-btn theme-float" data-theme-toggle aria-label="Switch between light and dark theme" title="Light / dark theme">
    <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <main class="auth">
    <aside class="auth-side" aria-hidden="true">
      <div class="brand"><span class="mark">{{ app_name[:1] }}</span>{{ app_name }}</div>
      <div class="auth-hero">
        <h2>Your community,<br><em>managed with care.</em></h2>
        <div class="ornament"><i></i></div>
        <p>Reports &bull; Announcements &bull; Security</p>
      </div>
      <div class="lotmap">
        {% for i in range(32) %}<span class="lot {{ 'lot-on' if i in (3, 9, 14, 21, 26) }}"></span>{% endfor %}
      </div>
      <p class="auth-script">Home, made effortless.</p>
    </aside>
    <section class="auth-main">
      <div class="auth-card">
        {% include '_flash.html' %}
        {% block content %}{% endblock %}
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
